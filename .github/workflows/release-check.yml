name: Native release checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into the native packages
        required: true
        default: '1.0.0-ci'

permissions:
  contents: read

jobs:
  extracted-demo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux/amd64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
          - runner: windows-2025
            target: windows/amd64
          - runner: macos-15-intel
            target: darwin/amd64
          - runner: macos-15
            target: darwin/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TLAB_VERSION: ${{ inputs.version || '1.0.0-ci' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build native archive and checksum
        env:
          TLAB_TARGET: ${{ matrix.target }}
        run: python scripts/package_release.py --version "$TLAB_VERSION" --out dist --target "$TLAB_TARGET"
        shell: bash
      - name: Verify checksum and extract archive
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import tarfile
          import zipfile
          digest, filename = Path('dist/SHA256SUMS').read_text().strip().split()
          archive = Path('dist') / filename
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
          if filename.endswith('.zip'):
              with zipfile.ZipFile(archive) as source:
                  source.extractall('extracted')
          else:
              with tarfile.open(archive) as source:
                  source.extractall('extracted', filter='data')
      - name: Exercise extracted binary without Go in PATH
        shell: python
        run: |
          from pathlib import Path
          import os
          import subprocess
          import sys
          binary = next(file for file in Path('extracted').glob('*/tesouro-lab*') if file.is_file())
          subprocess.run([sys.executable, 'scripts/smoke_release.py', str(binary),
                          '--version', os.environ['TLAB_VERSION']], check=True)
