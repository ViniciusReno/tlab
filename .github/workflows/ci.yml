name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o tesouro-lab ./cmd/tesouro-lab
      - name: Offline CLI smoke test
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: ./tesouro-lab analyze prefixado:2015-01-01 --source demo --yield 8.88 --amount 10000
